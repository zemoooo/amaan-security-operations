services:
  - type: web
    name: aman-security-operations
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: EVOLUTION_API_URL
        sync: false
      - key: EVOLUTION_API_KEY
        sync: false
      - key: EVOLUTION_DEFAULT_INSTANCE
        sync: false
      - key: EVOLUTION_WEBHOOK_SECRET
        sync: false
      - key: AI_MONITORING_ENABLED
        value: 'true'
      - key: AI_MONITOR_INTERVAL_SECONDS
        value: '10'
      - key: AI_ANALYSIS_MIN_CONFIDENCE
        value: '0.75'
      - key: AI_ALERT_MIN_SEVERITY
        value: HIGH
      - key: AI_ALERT_MIN_CONFIDENCE
        value: '0.80'
      - key: AI_ALERT_COOLDOWN_SECONDS
        value: '600'
      - key: AI_WORKING_HOURS
        value: '08:00-17:00'
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-5
      - key: APP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_SECURE
        value: 'false'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: SUPER_ADMIN_NAME
        sync: false
      - key: LICENSE_SECRET_SALT
        sync: false
